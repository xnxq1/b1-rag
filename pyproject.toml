[project]
name = "b1-rag"
version = "0.1.0"
description = "RAG-сервис: вопросы по документу с цитатами (FastAPI + Celery + Qdrant)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "anyio>=4.15.1",
    "celery-types>=0.26.0",
    "celery[redis]>=5.6.3",
    "click>=8.5.0",
    "dishka>=1.10.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "redis>=6.4.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "testcontainers[qdrant,redis]>=4.13.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: тесты с реальными Qdrant/Redis через testcontainers"]

[tool.ruff]
src = ["rag"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "FAST", "ASYNC", "ANN", "S", "B", "A", "COM", "C4",
    "T10", "EM", "EXE", "ISC", "ICN", "INP", "PIE", "T20", "PYI", "Q", "RSE", "RET", "SLF", "SIM", "SLOT", "TID",
    "TC", "ARG", "PTH", "FLY", "I", "N", "PERF", "E", "W", "F", "PLC", "PLE", "PLR", "PLW", "UP", "FURB",
    "LOG", "RUF",
]
ignore = ["RUF100", "RUF001", "RUF002", "RUF003", "PLR0913", "PLR0917", "ANN401", "COM812", "TC001", "TC002", "TC003"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]
"examples/*.py" = ["INP001", "ISC004", "T201"]
"__init__.py" = ["E402", "F401"]
"tests/**/*.py" = ["S101", "ASYNC240", "PLC0415", "ANN", "PLR2004", "SLF001", "INP001", "ARG"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["rag"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
